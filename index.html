<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main">
        <input type="text" id="inputbox" placeholder="0"> 
              <div class="btn">
                <div class="row">

                    <button onclick="removeLastItem()">X</button>
                    <button onclick="clearAll()">AC</button>
                    <button onclick="displayData('%')">%</button>
                    <button onclick="displayData('/')" style="background-color: rgb(230, 134, 9); height: 50px;width:50px;">/</button>
                </div>
           
                <div class="row">

                        <button  onclick="displayData('7')">7</button>
                        <button onclick="displayData('8')" >8</button>
                        <button  onclick="displayData('9')">9</button>
                        <button  onclick="displayData('*')"style="background-color: rgb(230, 134, 9); height: 50px;width: 50px;  ">*</button>
                </div>
             
                <div class="row">

                    <button  onclick="displayData('4')">4</button>
                    <button onclick="displayData('5')">5</button>
                    <button onclick="displayData('6')">6</button>
                    <button onclick="displayData('-')" style="background-color: rgb(230, 134, 9);  height: 50px;width: 50px;">-</button>
                </div>

                <div class="row">

                     <button onclick="displayData('1')" >1</button>
                    <button onclick="displayData('2')">2</button>
                    <button onclick="displayData('3')" >3</button>
                    <button  onclick="displayData('+')"style="background-color: rgb(230, 134, 9); height: 50px;width: 50px;  ">+</button>
            
                </div>

                <div class="row">

                    <button onclick="displayData('.')">.</button>
                    <button  onclick="displayData('0')">0</button>
                    
                    <button  onclick="displayOutput()" style="background-color: rgb(230, 134, 9); height: 50px;width: 120px; ">=</button>
                </div>
             
        </div>
                      
    </div>
</body> 
<script src="calcscript.js"></script>
</html>
